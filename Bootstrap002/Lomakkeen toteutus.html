<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lomakkeen toteutus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
<div class="row justify-content-center">
<div class="col-md-5">
<h2 class="text-center">Lomake</h2>
<form>       
<div class="mb-5">
<label for="etunimi" class="form-label">Etunimi</label>
<input type="text" class="form-control" id="etunimi" placeholder="Anna etunimi">
</div>        
<div class="mb-5">
<label for="sukunimi" class="form-label">Sukunimi</label>
<input type="text" class="form-control" id="sukunimi" placeholder="Anna sukunimi">
</div>       
<div class="mb-5">
<label for="email" class="form-label">Sähköpostiosoite</label>
<input type="email" class="form-control" id="email" placeholder="Anna sähköposti">
</div>      
<div class="mb-5">
<label for="viesti" class="form-label">Viesti</label>
<textarea class="form-control" id="viesti" rows="4" placeholder="Kirjoita viesti"></textarea>
</div>         
<div class="mb-5">
<label for="aihe" class="form-label">Aihe</label>
<select class="form-select" id="aihe">
<option selected disabled>Valitse aihe</option>
<option value="tuki">Tuki</option>
<option value="palaute">Palaute</option>
<option value="muu">Muu</option>
</select>
</div>  
<div class="d-grid">
<button type="submit" class="btn btn-primary">Lähetä</button>
</div>
</form>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
